apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vote-app-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/RAM55O/1vote-app.git" # Replace with your Git repo URL
    targetRevision: HEAD
    path: vote-app # Path to your Helm chart directory in Git
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: "https://kubernetes.default.svc"
    namespace: vote-apo-namespace # Target namespace for your app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
