name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    name: Build & Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build and Test with Maven
        run: mvn clean verify

      - name: SonarCloud / SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_ORG: ${{ secrets.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::warning::SONAR_TOKEN secret is not configured in GitHub repository secrets. Skipping Sonar scan."
          else
            HOST="${SONAR_HOST_URL:-https://sonarcloud.io}"
            if [ -n "$SONAR_ORG" ]; then
              ORG="$SONAR_ORG"
            else
              ORG=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
            fi

            if [ -n "$SONAR_PROJECT_KEY" ]; then
              PKEY="$SONAR_PROJECT_KEY"
            else
              PKEY="${ORG}_1vote-app"
            fi

            mvn org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar \
              -Dsonar.host.url="$HOST" \
              -Dsonar.token="$SONAR_TOKEN" \
              -Dsonar.organization="$ORG" \
              -Dsonar.projectKey="$PKEY" \
              -Dsonar.projectName="1vote-app"
          fi

  security-and-publish:
    name: Security Scan & Push Image
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build Docker Image locally for Trivy
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          format: "table"
          exit-code: "0" # Set to '1' to break the build on critical vulnerabilities
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Push Docker Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update Helm Chart Image Tag for Argo CD
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Update the tag in values.yaml
          sed -i 's/tag: .*/tag: "sha-${{ github.sha }}"/' vote-app/values.yaml
          sed -i 's|repository: .*|repository: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}'|' vote-app/values.yaml

          git add vote-app/values.yaml
          git commit -m "chore(ci): update image tag to sha-${{ github.sha }} [skip ci]"
          git push
